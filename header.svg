<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <filter id="auroraBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
       <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
       <stop offset="30%" stop-color="rgba(255, 255, 255, 0.0)" />
       <stop offset="70%" stop-color="rgba(255, 255, 255, 0.0)" />
       <stop offset="100%" stop-color="rgba(255, 255, 255, 0.2)" />
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
       <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
       <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .name-text {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Black", sans-serif;
        font-size: 64px;
        font-weight: 900;
        letter-spacing: 12px;
        text-anchor: middle;
      }
      .role-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 8px;
        fill: #38BDF8;
        text-anchor: middle;
      }
      .focus-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 3px;
        fill: #94A3B8;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)" rx="12" />

  <!-- Animated Aurora -->
  <circle cx="200" cy="30" r="120" fill="#EC4899" filter="url(#auroraBlur)" opacity="0.4">
    <animate attributeName="cx" values="200; 700; 200" dur="15s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="180" r="150" fill="#0EA5E9" filter="url(#auroraBlur)" opacity="0.4">
    <animate attributeName="cx" values="700; 200; 700" dur="18s" repeatCount="indefinite" />
  </circle>

  <rect width="900" height="220" fill="url(#grid)" rx="12" />

  <!-- Background Glass -->
  <g stroke="url(#glassEdge)" stroke-width="1.5" fill="url(#glassFill)">
    <polygon points="420,100 150,-20 380,-20" />
    <polygon points="480,90 380,-20 800,50" />
    <polygon points="500,120 800,50 950,200" />
    <polygon points="410,130 600,250 100,250" />
    <polygon points="200,60 140,30 180,90" stroke-width="1" />
  </g>

  <!-- Animated Scanline -->
  <rect x="0" y="0" width="900" height="2" fill="#38BDF8" opacity="0.3">
    <animate attributeName="y" values="0; 220; 0" dur="5s" repeatCount="indefinite" />
  </rect>

  <!-- Typography & Glitch -->
  <g transform="translate(450, 110)">
    <text x="0" y="0" class="name-text" fill="#EC4899" opacity="0.8">
      <animate attributeName="x" values="0; -4; 0; 5; 0; -2; 0" keyTimes="0; 0.05; 0.1; 0.4; 0.45; 0.8; 1" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0.3; 0.8; 1; 0.5; 0.8" keyTimes="0; 0.05; 0.1; 0.4; 0.45; 1" dur="2.5s" repeatCount="indefinite" />
      PRIYANSHU ROY
    </text>
    <text x="0" y="0" class="name-text" fill="#0EA5E9" opacity="0.8">
      <animate attributeName="x" values="0; 4; 0; -5; 0; 3; 0" keyTimes="0; 0.05; 0.1; 0.4; 0.45; 0.8; 1" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 1; 0.8; 0.4; 0.8; 0.8" keyTimes="0; 0.05; 0.1; 0.4; 0.45; 1" dur="2.5s" repeatCount="indefinite" />
      PRIYANSHU ROY
    </text>
    <text x="0" y="0" class="name-text" fill="#FFFFFF">
      <animate attributeName="opacity" values="1; 1; 1; 0.8; 1; 1; 1" keyTimes="0; 0.2; 0.22; 0.25; 0.28; 0.3; 1" dur="4s" repeatCount="indefinite" />
      PRIYANSHU ROY
    </text>
    <text x="0" y="45" class="role-text">AI/ML ENGINEER</text>
    <text x="0" y="75" class="focus-text">FOCUS: DEEP LEARNING &amp; SYSTEMS DESIGN</text>
  </g>

  <!-- Foreground Glass -->
  <polygon points="380,250 480,90 520,250" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" values="0 480 120; 2 480 120; 0 480 120" dur="10s" repeatCount="indefinite" />
  </polygon>

  <!-- Outer Border -->
  <rect width="898" height="218" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="12" />
</svg>
