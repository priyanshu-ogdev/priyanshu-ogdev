<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Holographic Aurora Blurs -->
    <filter id="auroraBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Glass Reflection Gradients -->
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
       <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
       <stop offset="30%" stop-color="rgba(255, 255, 255, 0.0)" />
       <stop offset="70%" stop-color="rgba(255, 255, 255, 0.0)" />
       <stop offset="100%" stop-color="rgba(255, 255, 255, 0.2)" />
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
       <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
       <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- System Font Styling -->
    <style>
      .name-text {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Black", sans-serif;
        font-size: 72px;
        font-weight: 900;
        letter-spacing: 12px;
        text-anchor: middle;
      }
      .role-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 8px;
        fill: #38BDF8;
        text-anchor: middle;
      }
      .focus-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        letter-spacing: 3px;
        fill: #94A3B8;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- 1. BASE BACKGROUND -->
  <rect width="900" height="300" fill="url(#bg)" rx="16" />

  <!-- 2. ANIMATED HOLOGRAPHIC AURORA -->
  <!-- Magenta Blob -->
  <circle cx="200" cy="50" r="150" fill="#EC4899" filter="url(#auroraBlur)" opacity="0.4">
    <animate attributeName="cx" values="200; 700; 200" dur="15s" repeatCount="indefinite" />
    <animate attributeName="cy" values="50; 250; 50" dur="20s" repeatCount="indefinite" />
  </circle>
  <!-- Cyan Blob -->
  <circle cx="700" cy="250" r="180" fill="#0EA5E9" filter="url(#auroraBlur)" opacity="0.4">
    <animate attributeName="cx" values="700; 200; 700" dur="18s" repeatCount="indefinite" />
    <animate attributeName="cy" values="250; 50; 250" dur="22s" repeatCount="indefinite" />
  </circle>
  <!-- Indigo/Purple Blob -->
  <circle cx="450" cy="150" r="200" fill="#6366F1" filter="url(#auroraBlur)" opacity="0.3">
    <animate attributeName="r" values="200; 250; 200" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- 3. TECH GRID OVERLAY -->
  <rect width="900" height="300" fill="url(#grid)" rx="16" />

  <!-- 4. BACKGROUND GLASS SHARDS (Impact at Center) -->
  <g stroke="url(#glassEdge)" stroke-width="1.5" fill="url(#glassFill)">
    <!-- Top Left Crack -->
    <polygon points="420,130 150,-20 380,-20" />
    <!-- Top Right Crack -->
    <polygon points="480,120 380,-20 800,50" />
    <!-- Right Crack -->
    <polygon points="500,160 800,50 950,200" />
    <!-- Bottom Right Crack -->
    <polygon points="470,190 950,200 600,350" />
    <!-- Bottom Left Crack -->
    <polygon points="410,180 600,350 100,350" />
    <!-- Left Crack -->
    <polygon points="380,140 100,350 -50,100" />
    <!-- Floating Detached Shard 1 -->
    <polygon points="200,80 140,50 180,120" stroke-width="1" />
    <!-- Floating Detached Shard 2 -->
    <polygon points="750,220 850,280 800,180" stroke-width="1" />
  </g>

  <!-- 5. CYBERPUNK UI ELEMENTS -->
  <!-- Corner TL -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6" />
  <!-- Corner TR -->
  <path d="M 870 60 L 870 30 L 840 30" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6" />
  <!-- Corner BL -->
  <path d="M 30 240 L 30 270 L 60 270" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6" />
  <!-- Corner BR -->
  <path d="M 870 240 L 870 270 L 840 270" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6" />
  
  <!-- Animated Scanline -->
  <rect x="0" y="0" width="900" height="2" fill="#38BDF8" opacity="0.3">
    <animate attributeName="y" values="0; 300; 0" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- 6. TYPOGRAPHY & GLITCH EFFECT -->
  <g transform="translate(450, 140)">
    
    <!-- Glitch Channel 1 (Magenta) -->
    <text x="0" y="0" class="name-text" fill="#EC4899" opacity="0.8">
      <animate attributeName="x" values="0; -4; 0; 5; 0; -2; 0" keyTimes="0; 0.05; 0.1; 0.4; 0.45; 0.8; 1" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0.3; 0.8; 1; 0.5; 0.8" keyTimes="0; 0.05; 0.1; 0.4; 0.45; 1" dur="2.5s" repeatCount="indefinite" />
      PRIYANSHU ROY
    </text>

    <!-- Glitch Channel 2 (Cyan) -->
    <text x="0" y="0" class="name-text" fill="#0EA5E9" opacity="0.8">
      <animate attributeName="x" values="0; 4; 0; -5; 0; 3; 0" keyTimes="0; 0.05; 0.1; 0.4; 0.45; 0.8; 1" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 1; 0.8; 0.4; 0.8; 0.8" keyTimes="0; 0.05; 0.1; 0.4; 0.45; 1" dur="2.5s" repeatCount="indefinite" />
      PRIYANSHU ROY
    </text>

    <!-- Main White Text -->
    <text x="0" y="0" class="name-text" fill="#FFFFFF">
      <animate attributeName="opacity" values="1; 1; 1; 0.8; 1; 1; 1" keyTimes="0; 0.2; 0.22; 0.25; 0.28; 0.3; 1" dur="4s" repeatCount="indefinite" />
      PRIYANSHU ROY
    </text>

    <!-- Subtitles -->
    <text x="0" y="50" class="role-text">AI/ML ENGINEER</text>
    <text x="0" y="85" class="focus-text">FOCUS: DEEP LEARNING &amp; SYSTEMS DESIGN</text>
  </g>

  <!-- 7. FOREGROUND GLASS (Overlaps the text for 3D depth) -->
  <polygon points="380,350 480,120 520,350" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5">
    <!-- Subtle rotation animation for the foreground shard -->
    <animateTransform attributeName="transform" type="rotate" values="0 480 120; 2 480 120; 0 480 120" dur="10s" repeatCount="indefinite" />
  </polygon>

  <!-- Outer Border -->
  <rect width="898" height="298" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="16" />
</svg>
